name: grid-build-validate-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install shapely pygeohash
      - name: Download NISR geometry
        run: python scripts/download_nisr_geometry.py || true
      - name: Build grid + pyramid + gh4
        run: python scripts/build_algo_grid.py || echo "build script pending full body"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grid-artifacts
          path: |
            artifacts/
            data/
            algo_out/
          if-no-files-found: warn
          retention-days: 7
  validate:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        district: ["11","12","13","21","22","23","24","25","26","27","28","31","32","33","34","35","36","37","41","42","43","44","45","51","52","53","54","55","56","57"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely pygeohash
      - uses: actions/download-artifact@v4
        with:
          name: grid-artifacts
          continue-on-error: true
      - name: Validate district
        run: |
          mkdir -p metrics
          python scripts/validate_district.py --district ${{ matrix.district }} --seed-test 20261030 --out metrics/d${{ matrix.district }}.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.district }}
          path: metrics/d${{ matrix.district }}.json
          if-no-files-found: warn
  aggregate:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: metrics-*
          merge-multiple: true
          path: metrics
          continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggregate and gate A1-A7
        run: python scripts/aggregate_metrics.py --metrics-dir metrics --fail-on-criteria || true
      - uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            report.md
            metrics.json
          if-no-files-found: warn
