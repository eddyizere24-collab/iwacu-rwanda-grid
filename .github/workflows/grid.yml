name: grid-build-validate-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke or full"
        default: "smoke"
        type: choice
        options: [smoke, full]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install shapely pygeohash
      - name: Download NISR geometry
        run: python scripts/download_nisr_geometry.py
      - name: Build grid + pyramid + gh4 + national
        run: python scripts/build_algo_grid.py --geojson data/rwanda_villages_full.geojson --out artifacts/algo_out
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grid-artifacts
          path: |
            artifacts/algo_out/
            data/
          if-no-files-found: error
          retention-days: 7
  validate:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SMOKE: Nyarugenge=11, Nyamasheke=37. Full matrix restored after green.
        district: ["11", "37"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely pygeohash
      - uses: actions/download-artifact@v4
        with:
          name: grid-artifacts
      - name: Validate district (100 pts smoke)
        run: |
          mkdir -p metrics
          python scripts/validate_district.py \
            --district ${{ matrix.district }} \
            --seed-test 20261030 \
            --points 100 \
            --geojson data/rwanda_villages_full.geojson \
            --chunks artifacts/algo_out/chunks_gh4 \
            --national data/rwanda_national.geojson \
            --out metrics/d${{ matrix.district }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.district }}
          path: metrics/d${{ matrix.district }}.json
  aggregate:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: metrics-*
          merge-multiple: true
          path: metrics
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggregate and gate A1-A7
        run: python scripts/aggregate.py --metrics-dir metrics --fail-on-criteria
      - uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            report.md
            metrics.json
          if-no-files-found: warn
