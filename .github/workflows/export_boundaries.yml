name: export-boundaries
concurrency:
  group: export-boundaries
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [wip/g4]
    paths: ["scripts/export_boundaries.py", ".github/workflows/export_boundaries.yml"]
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure NISR geojson
        run: |
          if [ ! -f data/rwanda_villages_full.geojson ]; then
            python scripts/download_nisr_geometry.py
          fi
      - run: python scripts/export_boundaries.py --out artifacts/boundaries
      - run: cat artifacts/boundaries/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: boundaries-export
          path: artifacts/boundaries/
          retention-days: 14
