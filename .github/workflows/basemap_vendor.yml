name: basemap-vendor-selfcontained
concurrency:
  group: basemap-vendor
  cancel-in-progress: false
on:
  workflow_dispatch:
jobs:
  vendor-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download vendor assets + FULL licences
        run: |
          set -e
          V=basemap/vendor
          mkdir -p "$V/fonts/Noto Sans Regular" "$V/licenses"
          curl -fsSL -o "$V/maplibre-gl.js" "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
          curl -fsSL -o "$V/maplibre-gl.css" "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
          curl -fsSL -o "$V/licenses/MAPLIBRE-LICENSE.txt" "https://raw.githubusercontent.com/maplibre/maplibre-gl-js/main/LICENSE.txt"
          curl -fsSL -o "$V/pmtiles.js" "https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"
          # FULL licence texts from upstream packages (not stubs)
          curl -fsSL -o "$V/licenses/PMTILES-LICENSE.txt" "https://raw.githubusercontent.com/protomaps/PMTiles/main/LICENSE"
          curl -fsSL -o "$V/licenses/NOTO-SANS-OFL.txt" "https://raw.githubusercontent.com/google/fonts/main/ofl/notosans/OFL.txt"
          wc -c "$V/licenses/"*.txt
          echo '--- NOTO first3'; head -3 "$V/licenses/NOTO-SANS-OFL.txt"
          echo '--- NOTO last3'; tail -3 "$V/licenses/NOTO-SANS-OFL.txt"
          echo '--- PMTILES first3'; head -3 "$V/licenses/PMTILES-LICENSE.txt"
          echo '--- PMTILES last3'; tail -3 "$V/licenses/PMTILES-LICENSE.txt"
          BASE="https://protomaps.github.io/basemaps-assets/fonts/Noto%20Sans%20Regular"
          for r in 0-255 256-511 512-767 768-1023 1024-1279; do
            curl -fsSL -o "$V/fonts/Noto Sans Regular/${r}.pbf" "$BASE/${r}.pbf" || true
          done

      - name: Ensure rwanda.pmtiles
        run: |
          if [ ! -f basemap/rwanda.pmtiles ]; then
            git fetch origin gh-pages
            git checkout origin/gh-pages -- basemap/rwanda.pmtiles basemap/build_report.json || true
          fi
          ls -lh basemap/rwanda.pmtiles

      - name: Stage site
        run: |
          mkdir -p _site/basemap/demo _site/basemap/vendor
          cp -a basemap/vendor/. _site/basemap/vendor/
          cp basemap/demo/index.html _site/basemap/demo/
          cp basemap/rwanda.pmtiles _site/basemap/
          cp ATTRIBUTION.md _site/ || true
          printf '%s\n' '<!DOCTYPE html><meta http-equiv="refresh" content="0;url=basemap/demo/">' > _site/index.html

      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true

      - name: Try enable GitHub Pages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          CODE=$(curl -s -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/eddyizere24-collab/iwacu-rwanda-grid/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "POST_pages_status=$CODE"
          cat /tmp/pages.json; echo
          CODE2=$(curl -s -o /tmp/pages2.json -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/eddyizere24-collab/iwacu-rwanda-grid/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "PUT_pages_status=$CODE2"
          cat /tmp/pages2.json; echo
          echo "POST=$CODE PUT=$CODE2" | tee pages_api_result.txt

      - name: Playwright (live Pages or skip)
        run: |
          npm init -y >/dev/null
          npm install -q playwright@1.49.0
          npx playwright install --with-deps chromium
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const url = 'https://eddyizere24-collab.github.io/iwacu-rwanda-grid/basemap/demo/';
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const reqs = [];
            page.on('request', r => reqs.push(r.url()));
            let goto_error = null;
            try {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(4000);
            } catch (e) { goto_error = String(e); }
            const external = reqs.filter(u => {
              try {
                const h = new URL(u).hostname;
                return h && !h.endsWith('github.io') && !h.endsWith('githubusercontent.com');
              } catch { return true; }
            });
            const report = { url, goto_error, n_requests: reqs.length, external, all_urls: reqs };
            fs.writeFileSync('playwright_requests.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            await browser.close();
          })();
          JS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-proof
          path: |
            playwright_requests.json
            pages_api_result.txt
