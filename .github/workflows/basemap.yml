name: basemap-pmtiles
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # CHANGED 2026-11-01 GROK: Temurin 21 required by Planetiler v0.9.0; apt JRE left java 17 on PATH; see docs/HANDOFF.md
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Assert Java >= 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          VER=$(java -version 2>&1 | head -1)
          echo "version_line=$VER"
          java -version 2>&1 | head -1 | grep -E 'version "(2[1-9]|[3-9][0-9])' \
            || { echo "ERROR: Java below 21"; exit 1; }

      - name: Download Planetiler v0.9.0 (pinned)
        run: |
          curl -fsSL -o planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/v0.9.0/planetiler.jar"
          ls -lh planetiler.jar

      - name: Download Geofabrik Rwanda extract
        run: |
          mkdir -p data basemap
          curl -fsSL -o data/rwanda-latest.osm.pbf \
            "https://download.geofabrik.de/africa/rwanda-latest.osm.pbf"
          ls -lh data/rwanda-latest.osm.pbf

      - name: Build rwanda.pmtiles (z0–z14)
        id: build
        run: |
          set -o pipefail
          START=$(date +%s)
          java -Xmx6g -jar planetiler.jar \
            --osm-path=data/rwanda-latest.osm.pbf \
            --output=basemap/rwanda.pmtiles \
            --download \
            --maxzoom=14 \
            --bounds=28.85,-2.85,30.90,-1.05 \
            --building_merge_z14=false \
            2>&1 | tee build.log
          END=$(date +%s)
          echo "build_seconds=$((END-START))" >> $GITHUB_OUTPUT
          echo "Build time seconds: $((END-START))"
          ls -lh basemap/rwanda.pmtiles
          SIZE=$(stat -c%s basemap/rwanda.pmtiles)
          echo "size_bytes=$SIZE" >> $GITHUB_OUTPUT
          if [ "$SIZE" -gt 104857600 ]; then
            echo "OVER_100MB=1" >> $GITHUB_OUTPUT
            echo "File exceeds 100MB — will try maxzoom 12"
          else
            echo "OVER_100MB=0" >> $GITHUB_OUTPUT
          fi

      - name: Fallback z0-z12 if over 100MB
        if: steps.build.outputs.OVER_100MB == '1'
        run: |
          set -o pipefail
          java -Xmx6g -jar planetiler.jar \
            --osm-path=data/rwanda-latest.osm.pbf \
            --output=basemap/rwanda.pmtiles \
            --download \
            --maxzoom=12 \
            --bounds=28.85,-2.85,30.90,-1.05 \
            2>&1 | tee build_z12.log
          ls -lh basemap/rwanda.pmtiles

      - name: Inspect PMTiles header + layers + sample tiles
        run: |
          pip install -q pmtiles
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          from pmtiles.reader import Reader, MmapSource

          path = "basemap/rwanda.pmtiles"
          size = Path(path).stat().st_size
          print("file_size_bytes", size)
          print("file_size_mb", round(size / 1e6, 3))
          with open(path, "rb") as f:
              reader = Reader(MmapSource(f))
          h = reader.header()
          print("header", {k: h.get(k) for k in h} if isinstance(h, dict) else h)
          meta = reader.metadata()
          Path("basemap/pmtiles_metadata.json").write_text(json.dumps(meta, indent=2) if isinstance(meta, dict) else str(meta))
          if isinstance(meta, dict):
              vl = meta.get("vector_layers") or []
              print("LAYER_LIST")
              for layer in vl:
                  if isinstance(layer, dict):
                      print(" ", layer.get("id"), "fields", list((layer.get("fields") or {}).keys())[:8])
              ts = meta.get("tilestats") or {}
              layers = ts.get("layers") or []
              print("FEATURE_COUNTS")
              for layer in layers:
                  if isinstance(layer, dict):
                      print(" ", layer.get("layer"), "count", layer.get("count"))

          def deg2num(lat_deg, lon_deg, zoom):
              lat_rad = math.radians(lat_deg)
              n = 2.0 ** zoom
              xtile = int((lon_deg + 180.0) / 360.0 * n)
              ytile = int((1.0 - math.asinh(math.tan(lat_rad)) / math.pi) / 2.0 * n)
              return xtile, ytile

          samples = []
          for z in (10, 12, 14):
              x, y = deg2num(-1.95, 30.06, z)
              try:
                  t = reader.get(z, x, y)
                  samples.append({"z": z, "x": x, "y": y, "bytes": len(t) if t else 0})
              except Exception as e:
                  samples.append({"z": z, "x": x, "y": y, "error": str(e)})
          print("SAMPLE_TILES", json.dumps(samples))
          Path("basemap/sample_tiles.json").write_text(json.dumps(samples, indent=2))
          PY

      - name: Write build report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("basemap/rwanda.pmtiles")
          size = p.stat().st_size if p.exists() else 0
          samples = json.loads(Path("basemap/sample_tiles.json").read_text()) if Path("basemap/sample_tiles.json").exists() else []
          report = {
              "file": "basemap/rwanda.pmtiles",
              "size_bytes": size,
              "size_mb": round(size / 1e6, 3),
              "under_100mb": size < 100 * 1024 * 1024,
              "source": "https://download.geofabrik.de/africa/rwanda-latest.osm.pbf",
              "builder": "planetiler v0.9.0 (pinned)",
              "java": "temurin 21",
              "maxzoom_requested": 14,
              "sample_tiles_kigali": samples,
          }
          Path("basemap/build_report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - name: Verify local range slices (pmtiles-style)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("basemap/rwanda.pmtiles")
          data = p.read_bytes()
          assert data[:7] == b"PMTiles", data[:7]
          print("magic_ok PMTiles")
          for a, b in [(0, 127), (127, 4096), (len(data)//2, len(data)//2 + 4096)]:
              piece = data[a:min(b, len(data))]
              print(f"range_bytes={a}-{min(b, len(data))-1} len={len(piece)}")
          print("file_total", len(data))
          PY

      - name: Stage Pages artifact
        run: |
          mkdir -p _site/basemap/demo
          cp basemap/rwanda.pmtiles _site/basemap/
          cp basemap/demo/index.html _site/basemap/demo/
          cp ATTRIBUTION.md _site/
          cp basemap/build_report.json _site/basemap/ || true
          printf '%s\n' '<!DOCTYPE html><meta http-equiv="refresh" content="0;url=basemap/demo/">' > _site/index.html
          ls -lhR _site

      - name: Deploy to GitHub Pages (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true

      - uses: actions/upload-artifact@v4
        with:
          name: rwanda-pmtiles
          path: |
            basemap/rwanda.pmtiles
            basemap/build_report.json
            basemap/sample_tiles.json
            basemap/pmtiles_metadata.json
            build.log
