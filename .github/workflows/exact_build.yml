name: exact-build-invariants
on:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely pygeohash pyproj
      - name: Ensure geojson
        run: |
          if [ ! -f data/rwanda_villages_full.geojson ]; then
            python scripts/download_nisr_geometry.py
          fi
      - name: Filter 4 districts + build IRG2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          with open("data/rwanda_villages_full.geojson") as f:
              fc = json.load(f)
          keep = {"11", "12", "13", "37"}
          fc["features"] = [ft for ft in fc["features"] if str(ft["properties"]["district_id"]) in keep]
          Path("data/rwanda_4d.geojson").write_text(json.dumps(fc))
          print("features", len(fc["features"]))
          PY
          python scripts/build_exact_grid.py --geojson data/rwanda_4d.geojson --out artifacts/exact_out
      - name: 1 Round-trip codec
        run: |
          export PYTHONPATH=scripts
          # synthetic mixed lengths + rebuilt cells via encode/decode of shipped files
          python scripts/test_codec_roundtrip.py --out data/codec_roundtrip.json || true
          # also: load all shipped cells into dict, re-encode IRG2, compare
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from grid_codec import load_root, load_gh6_file, write_binary_chunk, read_binary_chunk, longest_prefix
          import pygeohash as pgh, random
          meta, root, vids = load_root(Path("artifacts/exact_out/root.bin.gz"))
          cells = dict(root)
          for p in Path("artifacts/exact_out/gh6").glob("*.bin.gz"):
              cells.update(load_gh6_file(p, vids))
          vindex = {v: i for i, v in enumerate(vids)}
          raw = write_binary_chunk(cells, vindex)
          decoded = read_binary_chunk(raw, vids)
          miss = set(cells) - set(decoded)
          rng = random.Random(42)
          disagree = 0
          examples = []
          for _ in range(100000):
              lat = rng.uniform(-2.9, -1.0)
              lon = rng.uniform(28.8, 30.9)
              gh9 = pgh.encode(lat, lon, 9)
              kj, ij = longest_prefix(gh9, cells)
              kb, ib = longest_prefix(gh9, decoded)
              vj = ij["shares"][0][0] if ij else None
              vb = ib["shares"][0][0] if ib else None
              if kj != kb or vj != vb:
                  disagree += 1
                  if len(examples) < 10:
                      examples.append({"gh9": gh9, "json_key": kj, "bin_key": kb, "json_v": vj, "bin_v": vb})
          rep = {"n_cells": len(cells), "key_missing": len(miss), "lookup_disagree_100k": disagree, "examples": examples, "pass": len(miss)==0 and disagree==0}
          Path("data/codec_roundtrip.json").write_text(json.dumps(rep, indent=2))
          print(json.dumps(rep, indent=2))
          PY
      - name: 2 Key consistency
        run: |
          export PYTHONPATH=scripts
          python scripts/test_key_consistency.py --out-dir artifacts/exact_out --out data/key_consistency.json || true
          cat data/key_consistency.json
      - name: 3 District collision
        run: |
          export PYTHONPATH=scripts
          python scripts/test_district_collision.py --out-dir artifacts/exact_out --out data/district_collision.json || true
          cat data/district_collision.json
      - name: Invariants binary
        run: |
          export PYTHONPATH=scripts
          python scripts/check_invariants_binary.py --districts 11,12,13,37 --out-dir artifacts/exact_out --out data/invariants_report.json || true
          cat data/invariants_report.json
      - run: python scripts/size_benchmark.py --out-dir artifacts/exact_out --out data/size_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-merged-invariants
          path: |
            artifacts/exact_out/
            data/invariants_report.json
            data/size_benchmark.json
            data/codec_roundtrip.json
            data/key_consistency.json
            data/district_collision.json
  publish-results:
    needs: [build-and-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: exact-merged-invariants
          path: /tmp/art
      - name: Commit reports to results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin results 2>/dev/null || true
          if git rev-parse --verify origin/results >/dev/null 2>&1; then
            git checkout -B results origin/results
          else
            git checkout --orphan results
            git reset
          fi
          mkdir -p data
          for f in invariants_report.json size_benchmark.json codec_roundtrip.json key_consistency.json district_collision.json; do
            find /tmp/art -name "$f" -exec cp -f {} data/ \; || true
          done
          ls -la data/
          cat data/codec_roundtrip.json || true
          cat data/key_consistency.json || true
          cat data/district_collision.json || true
          cat data/invariants_report.json || true
          cat data/size_benchmark.json || true
          git add -f data/*.json || true
          if git diff --cached --quiet; then
            echo No changes
          else
            git commit -m "results: run ${{ github.run_id }}"
            git push -u origin results
            git rev-parse HEAD
          fi
