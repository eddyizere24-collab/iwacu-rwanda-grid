name: exact-build-invariants
on:
  workflow_dispatch:
jobs:
  build-district:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        district: ["11", "12", "13", "37"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely pygeohash pyproj
      - name: Ensure geojson
        run: |
          if [ ! -f data/rwanda_villages_full.geojson ]; then
            python scripts/download_nisr_geometry.py
          fi
      - run: python scripts/build_exact_grid.py --district ${{ matrix.district }} --out artifacts/exact_out_${{ matrix.district }}
      - uses: actions/upload-artifact@v4
        with:
          name: exact-${{ matrix.district }}
          path: artifacts/exact_out_${{ matrix.district }}/
  merge-invariants:
    needs: build-district
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely pygeohash pyproj
      - name: Ensure geojson
        run: |
          if [ ! -f data/rwanda_villages_full.geojson ]; then
            python scripts/download_nisr_geometry.py
          fi
      - name: Rebuild coherent 4-district index
        run: |
          # Filter geojson to 4 districts then build once (avoids broken max-root merge)
          python - <<'PY'
          import json
          from pathlib import Path
          with open("data/rwanda_villages_full.geojson") as f:
              fc = json.load(f)
          keep = {"11", "12", "13", "37"}
          fc["features"] = [ft for ft in fc["features"] if str(ft["properties"]["district_id"]) in keep]
          Path("data/rwanda_4d.geojson").write_text(json.dumps(fc))
          print("features", len(fc["features"]))
          PY
          python scripts/build_exact_grid.py --geojson data/rwanda_4d.geojson --out artifacts/exact_out
      - name: Invariants (binary longest-prefix)
        run: |
          export PYTHONPATH=scripts
          python scripts/check_invariants_binary.py --districts 11,12,13,37 --out-dir artifacts/exact_out --out data/invariants_report.json || true
          cat data/invariants_report.json
      - run: python scripts/size_benchmark.py --out-dir artifacts/exact_out --out data/size_benchmark.json || echo '{"note":"size failed"}' > data/size_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-merged-invariants
          path: |
            artifacts/exact_out/
            data/invariants_report.json
            data/size_benchmark.json
          if-no-files-found: warn
  national-osm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely
      - name: Ensure geojson
        run: |
          if [ ! -f data/rwanda_villages_full.geojson ]; then
            python scripts/download_nisr_geometry.py
          fi
      - run: python scripts/build_national_osm.py
      - run: python scripts/extract_kivu_piece.py
      - run: python scripts/kivu_deviation.py
      - uses: actions/upload-artifact@v4
        with:
          name: national-kivu
          path: |
            data/rwanda_national.geojson
            data/rwanda_national_meta.json
            data/kivu_water_piece.geojson
            data/kivu_piece_meta.json
            data/kivu_test_points.csv
            data/kivu_deviation.json
  publish-results:
    needs: [merge-invariants, national-osm]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: national-kivu
          path: /tmp/art_nat
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: exact-merged-invariants
          path: /tmp/art_inv
          merge-multiple: true
      - name: Collect files
        run: |
          mkdir -p /tmp/pubdata
          find /tmp/art_nat /tmp/art_inv -type f \( -name 'kivu_water_piece.geojson' -o -name 'rwanda_national.geojson' -o -name 'kivu_test_points.csv' -o -name 'kivu_deviation.json' -o -name 'kivu_piece_meta.json' -o -name 'invariants_report.json' -o -name 'size_benchmark.json' \) -exec cp -f {} /tmp/pubdata/ \;
          ls -la /tmp/pubdata
          cat /tmp/pubdata/invariants_report.json || true
          cat /tmp/pubdata/size_benchmark.json || true
      - name: Commit to results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin results 2>/dev/null || true
          if git rev-parse --verify origin/results >/dev/null 2>&1; then
            git checkout -B results origin/results
          else
            git checkout --orphan results
            git reset
          fi
          mkdir -p data
          cp -f /tmp/pubdata/* data/
          git add -f data/kivu_water_piece.geojson data/rwanda_national.geojson \
                    data/kivu_test_points.csv data/kivu_deviation.json \
                    data/kivu_piece_meta.json data/invariants_report.json \
                    data/size_benchmark.json
          if git diff --cached --quiet; then
            echo "No changes"
            git log -1 --oneline || true
          else
            git commit -m "results: run ${{ github.run_id }}"
            git push -u origin results
            echo "RESULTS_SHA=$(git rev-parse HEAD)"
            git rev-parse HEAD
          fi
