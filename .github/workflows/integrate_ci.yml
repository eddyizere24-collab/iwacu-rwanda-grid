name: integrate-ci
concurrency:
  group: integrate-ci
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [wip/integrate]
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fail on third-party runtime URLs in packages
        run: |
          set -euo pipefail
          hits=$(grep -RInE 'https?://' packages/*/src packages/basemap-style/src/style.json 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "FAIL: third-party URL in package source"
            exit 1
          fi
          echo "no third-party URLs in packages/*/src"
      - name: Build and unit-test packages
        run: |
          set -e
          for p in packages/grid-lookup packages/offline-locate packages/landmarks packages/places-search packages/basemap-style; do
            if [ -f "$p/package.json" ] && [ -d "$p/src" ]; then
              echo "=== $p ==="
              (cd "$p" && npm install && npm run build && npm test)
            else
              echo "skip $p (no src)"
            fi
          done
      - name: Python syntax check scripts
        run: |
          for f in scripts/dissolve_hierarchy.py scripts/extract_landmarks.py; do
            if [ -f "$f" ]; then python3 -c "import ast; ast.parse(open('$f').read())"; fi
          done
          echo py_ok
