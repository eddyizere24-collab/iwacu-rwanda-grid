name: diagnose-purity
on:
  workflow_dispatch:
jobs:
  purity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely pygeohash
      - name: Download grid artifacts from latest successful grid build
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: grid.yml
          workflow_conclusion: success
          name: grid-artifacts
          path: .
          search_artifacts: true
      - run: python scripts/diagnose_purity.py --districts 11,37 --out data/purity_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: purity-report
          path: data/purity_report.json
